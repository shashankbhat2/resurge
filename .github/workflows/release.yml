# Builds a signed release when a version tag is pushed, and publishes it as a GitHub release.
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# The tag must match versionName in app/build.gradle.kts, and CHANGELOG.md must have a
# "## 0.4.0 (...)" section; its contents become the release notes.
#
# Secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64       base64 of keystore/resurge-upload.jks
#   RELEASE_STORE_PASSWORD        storePassword from keystore.properties
#   RELEASE_KEY_ALIAS             keyAlias from keystore.properties
#   RELEASE_KEY_PASSWORD          keyPassword from keystore.properties
#   GOOGLE_SERVICES_JSON_BASE64   base64 of app/google-services.json
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check version and changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$VERSION" != "$NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $NAME in app/build.gradle.kts"
            exit 1
          fi
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore signing key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # Without these the build would quietly produce an unsigned APK, so stop here instead.
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret for $name"
              exit 1
            fi
          done
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/resurge-upload.jks
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          cat > keystore.properties <<EOF
          storeFile=keystore/resurge-upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test
        run: ./gradlew testDebugUnitTest :app:checkNoMaterial

      - name: Build APK and app bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/resurge-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/resurge-$VERSION.aab"

      # The bundle is for Play (it carries the R8 mapping); the mapping is kept here too for reading stack traces.
      - uses: actions/upload-artifact@v4
        with:
          name: resurge-${{ env.VERSION }}-play
          path: |
            out/resurge-${{ env.VERSION }}.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "out/resurge-$VERSION.apk" \
            --title "Resurge $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
