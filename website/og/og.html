<!doctype html>
<!-- The share image (1200×630). `npm run og` renders it to public/og.jpg. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  
  @font-face { font-family: "Figtree"; src: url("../public/fonts/figtree.ttf"); font-weight: 300 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; color: #fff; font-family: Figtree, sans-serif; -webkit-font-smoothing: antialiased; }
  .page { position: relative; width: 1200px; height: 630px; padding: 72px 80px; }
  .glow { position: absolute; right: -120px; top: -80px; width: 760px; height: 760px; background: radial-gradient(closest-side, rgba(139,124,255,0.12), transparent); }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Figtree"; font-weight: 600; font-size: 34px; letter-spacing: -0.02em; }
  .brand img { height: 34px; }
  h1 { margin-top: 64px; font-family: "Figtree"; font-weight: 600; font-size: 88px; line-height: 0.98; letter-spacing: -0.035em; }
  h1 span { color: #8f8f8f; }
  .sub { margin-top: 30px; font-size: 26px; color: #a3a3a3; }
  .sub b { color: #fff; font-weight: 600; }
  .phone { position: absolute; right: 88px; top: 70px; width: 330px; height: 680px; padding: 11px; border-radius: 54px; background: #1a1a1a; border: 1px solid #2a2a2a; box-shadow: 0 30px 120px rgba(0,0,0,0.8); }
  .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #000; }
  .screen img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="page">
    <div class="glow"></div>
    <div class="brand"><img src="../public/mark.png" alt="">Resurge</div>
    <h1>Your whole day.<br><span>One calm coach.</span></h1>
    <p class="sub">AI health coach for Android · <b>Join the waitlist</b></p>
    <div class="phone"><div class="screen"><img src="../public/ui/screen-scores.webp" alt=""></div></div>
  </div>
</body>
</html>
