<!doctype html>
<!--
  The share image (1200×630). `npm run og` renders it to public/og.jpg. It follows the site: pitch
  black with chalk dust, rails and hairlines meeting at the coach's star, and the phone slipping
  behind the bottom bar like the hero's does behind the next section.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Figtree"; src: url("../public/fonts/figtree.ttf"); font-weight: 300 900; }
  @font-face { font-family: "Inter"; src: url("../public/fonts/inter.woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #000 url("../public/dust.webp") 0 0 / 1600px; color: #fff; font-family: Figtree, sans-serif; -webkit-font-smoothing: antialiased; }
  .page { position: relative; width: 1200px; height: 630px; }

  /* Rails at the column's edges, and the hairlines across. */
  .rail { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.08); z-index: 3; }
  .line { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.08); z-index: 4; }
  .star { position: absolute; width: 14px; height: 14px; transform: translate(-50%, -50%); z-index: 5; }

  .bar { position: absolute; left: 60px; right: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #000; z-index: 2; }
  .top { top: 0; height: 64px; }
  .bottom { bottom: 0; height: 64px; }
  .brand { display: flex; align-items: baseline; gap: 10px; font-weight: 600; font-size: 24px; letter-spacing: -0.02em; }
  .brand img { height: 17px; filter: grayscale(1); }
  .label { font-family: Inter, sans-serif; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #7a7a7a; }
  .label b { color: #fff; font-weight: 500; }

  .copy { position: absolute; left: 88px; top: 118px; }
  .icon { width: 72px; height: 72px; border-radius: 22%; }
  h1 { margin-top: 30px; font-weight: 600; font-size: 76px; line-height: 1; letter-spacing: -0.035em; }
  h1 span { color: #8f8f8f; }
  .sub { margin-top: 24px; font-family: Inter, sans-serif; font-size: 21px; color: #a3a3a3; }

  /* A slim phone, cut off by the bottom bar. */
  .phone { position: absolute; right: 120px; top: 104px; width: 320px; height: 660px; padding: 5px; border-radius: 40px; background: #0d0d0d; border: 1px solid rgba(255,255,255,0.1); z-index: 1; }
  .screen { width: 100%; height: 100%; border-radius: 35px; overflow: hidden; background: #000; }
  .screen img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="page">
    <div class="bar top">
      <div class="brand"><img src="../public/mark.png" alt="">Resurge</div>
      <span class="label">resurge.fit</span>
    </div>

    <div class="copy">
      <img class="icon" src="../public/icon.png" alt="">
      <h1>Your whole day.<br><span>One calm coach.</span></h1>
      <p class="sub">An AI health coach for Android.</p>
    </div>

    <div class="phone"><div class="screen"><img src="../public/ui/screen-scores.webp" alt=""></div></div>

    <div class="bar bottom">
      <span class="label">Coming to Google Play</span>
      <span class="label"><b>Join the waitlist</b></span>
    </div>

    <div class="rail" style="left:60px"></div>
    <div class="rail" style="left:1140px"></div>
    <div class="line" style="top:64px"></div>
    <div class="line" style="top:566px"></div>
    <svg class="star" style="left:60px;top:64px" viewBox="0 0 24 24"><path d="M12,2.8 C13.1,8.2 15.8,10.9 21.2,12 C15.8,13.1 13.1,15.8 12,21.2 C10.9,15.8 8.2,13.1 2.8,12 C8.2,10.9 10.9,8.2 12,2.8 Z" fill="#000" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <svg class="star" style="left:1140px;top:64px" viewBox="0 0 24 24"><path d="M12,2.8 C13.1,8.2 15.8,10.9 21.2,12 C15.8,13.1 13.1,15.8 12,21.2 C10.9,15.8 8.2,13.1 2.8,12 C8.2,10.9 10.9,8.2 12,2.8 Z" fill="#000" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <svg class="star" style="left:60px;top:566px" viewBox="0 0 24 24"><path d="M12,2.8 C13.1,8.2 15.8,10.9 21.2,12 C15.8,13.1 13.1,15.8 12,21.2 C10.9,15.8 8.2,13.1 2.8,12 C8.2,10.9 10.9,8.2 12,2.8 Z" fill="#000" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <svg class="star" style="left:1140px;top:566px" viewBox="0 0 24 24"><path d="M12,2.8 C13.1,8.2 15.8,10.9 21.2,12 C15.8,13.1 13.1,15.8 12,21.2 C10.9,15.8 8.2,13.1 2.8,12 C8.2,10.9 10.9,8.2 12,2.8 Z" fill="#000" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
</body>
</html>
